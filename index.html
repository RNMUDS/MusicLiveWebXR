<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Concert - WebGPU Experience</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #000;
            font-family: 'Arial', sans-serif;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
        }

        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.6;
            z-index: 100;
        }


        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
            z-index: 200;
        }
    </style>
</head>
<body>
    <div id="loading">Loading Concert...</div>

    <div id="info">
        <strong>Live Concert - WebGPU Experience</strong><br>
        観客数: <span id="audience-count">0</span>人<br>
        FPS: <span id="fps">0</span><br>
        レンダラー: <span id="renderer-type">WebGPU</span><br>
        カメラ操作: マウスドラッグ + ホイール
    </div>

    <div id="canvas-container"></div>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
